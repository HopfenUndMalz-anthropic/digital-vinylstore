const nav = document.getElementById("nav");
const list = document.getElementById("list");
const title = document.getElementById("genre-title");
const note = document.getElementById("genre-note");
const subs = document.getElementById("subs");
const genreLink = document.getElementById("genre-link");
const search = document.getElementById("search");
let activeIndex = 0;
let activeSub = null;

function fmt(p) { return p.toFixed(2).replace(".", ",") + " €"; }

// Günstigster verfügbarer Shop
function best(r) {
  if (r.hhv == null && r.vp == null) return null;
  if (r.vp == null) return { shop: "HHV", price: r.hhv, url: r.hhvUrl };
  if (r.hhv == null) return { shop: "vinylpladen.de", price: r.vp, url: r.vpUrl || VP_HOME };
  return r.vp < r.hhv
    ? { shop: "vinylpladen.de", price: r.vp, url: r.vpUrl || VP_HOME }
    : { shop: "HHV", price: r.hhv, url: r.hhvUrl };
}

function priceHtml(r) {
  const b = best(r);
  const lines = [];
  lines.push(`HHV: <span>${r.hhv != null ? fmt(r.hhv) : "nicht verfügbar"}</span>`);
  lines.push(`vinylpladen.de: <span>${r.vp != null ? fmt(r.vp) : "nicht verfügbar"}</span>`);
  if (b) lines.push(`Günstigster: <span>${fmt(b.price)} bei ${b.shop}</span>`);
  const n = r.note ? `<br><em style="color:#9a9a9a">${r.note}</em>` : "";
  return `<div class="price">${lines.join("<br>")}${n}</div>`;
}

function card(r, k) {
  const b = best(r);
  const key = keyOf(r).replace(/"/g, "&quot;");
  const buttons = (r.links && r.links.length === 2)
    ? `<a class="buy" href="${r.links[0].url}" target="_blank" rel="noopener">${r.links[0].label}</a><a class="buy" href="${r.links[1].url}" target="_blank" rel="noopener">${r.links[1].label}</a>`
    : `<a class="buy" href="${b ? b.url : VP_HOME}" target="_blank" rel="noopener">Zum günstigsten Shop</a>`;
  return `
    <li>
      ${r.tag ? `<span class="tag tag-badge tag-${r.tag}">${r.tag}</span>` : ""}
      <div class="rank">${k + 1}</div>
      <div class="info">
        <button class="heart ${isFav(r) ? "on" : ""}" data-fav="${key}" title="Favorit">${isFav(r) ? "♥" : "♡"}</button>
        ${r.soldOut ? `<span class="tag tag-soldout">ausverkauft</span>` : ""}
        <div class="artist">${r.artist}${r.year ? " · " + r.year : ""} · ${r.sub}</div>
        <div class="title">${r.title}</div>
        ${r.remark ? `<div class="meta"><em>${r.remark}</em></div>` : ""}
        ${priceHtml(r)}
        ${buttons}
      </div>
    </li>`;
}

function show(i) {
  activeIndex = i;
  currentView = null;
  activeSub = null;
  document.querySelectorAll("nav button").forEach((b, j) => b.classList.toggle("active", i === j));
  const g = GENRES[i];
  title.textContent = g.name;
  note.textContent = g.records.length + " Platten · Preise aus HHV und vinylpladen.de";
  renderSubs(g);
  const topList = g.records.filter(r => r.tag);
  renderList(topList.length ? topList : g.records);
  genreLink.href = "https://www.hhv.de/records";
}

function renderSubs(g) {
  const uniq = [...new Set(g.records.map(r => r.sub))];
  subs.innerHTML = uniq.map(s => `<button data-sub="${s}">${s}</button>`).join("");
  subs.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      activeSub = activeSub === btn.dataset.sub ? null : btn.dataset.sub;
      subs.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.sub === activeSub));
      renderList(activeSub ? g.records.filter(r => r.sub === activeSub) : (g.records.some(r => r.tag) ? g.records.filter(r => r.tag) : g.records));
    };
  });
}

function renderList(records) {
  list.innerHTML = records.length ? records.map((r, k) => card(r, k)).join("") : "<li>Keine Treffer.</li>";
}

search.addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { show(activeIndex); return; }
  const hits = [];
  GENRES.forEach(g => g.records.forEach(r => {
    if ((r.artist + " " + r.title).toLowerCase().includes(q)) hits.push({ ...r, genreName: g.name });
  }));
  title.textContent = "Suche: " + e.target.value.trim();
  note.textContent = hits.length + " Treffer in allen Genres.";
  subs.innerHTML = "";
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  const q2 = encodeURIComponent(e.target.value.trim());
  list.innerHTML = (hits.length
    ? hits.map((r, k) => card({ ...r, sub: r.sub + " · " + r.genreName }, k)).join("")
    : "<li>Keine Treffer in den Top-Listen.</li>")
    + `<li style="display:block"><div class="info"><div class="title">Platte nicht dabei?</div>
       <div class="meta">Die Suche durchsucht nur die Top-Listen. Alles im Shop findest du hier:</div>
       <a class="buy" href="${HHV_SEARCH}${q2}" target="_blank" rel="noopener">Im HHV-Shop suchen</a>
       <a class="buy" href="${VP_HOME}" target="_blank" rel="noopener" style="margin-left:.5rem">vinylpladen.de öffnen</a>
       </div></li>`;
});

// Favoriten: im lokalen Browser gespeichert
const FAV_KEY = "plattenstore-favoriten";
let currentView = null;
function favs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) { return []; } }
function saveFavs(a) { try { localStorage.setItem(FAV_KEY, JSON.stringify(a)); } catch (e) {} }
function keyOf(r) { return r.artist + " | " + r.title; }
function isFav(r) { return favs().includes(keyOf(r)); }

list.addEventListener("click", (e) => {
  const btn = e.target.closest("button.heart");
  if (!btn) return;
  const k = btn.dataset.fav;
  const a = favs();
  const i = a.indexOf(k);
  if (i >= 0) a.splice(i, 1); else a.push(k);
  saveFavs(a);
  btn.classList.toggle("on", i < 0);
  btn.textContent = i < 0 ? "♥" : "♡";
  if (currentView === showFavs) showFavs();
});

function showFavs() {
  currentView = showFavs;
  activeIndex = -1;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.fav === "1"));
  title.textContent = "Favoriten";
  subs.innerHTML = "";
  const all = [];
  GENRES.forEach(g => g.records.forEach(r => { if (isFav(r)) all.push({ ...r, sub: r.sub + " · " + g.name }); }));
  note.textContent = all.length + " Favoriten · Summe über den jeweils günstigsten Preis";
  const sumBest = all.reduce((s, r) => s + (best(r) ? best(r).price : 0), 0);
  const sumHHV = all.reduce((s, r) => s + (r.hhv != null ? r.hhv : 0), 0);
  const sumVP = all.reduce((s, r) => s + (r.vp != null ? r.vp : 0), 0);
  const fehlt = all.filter(r => best(r) == null).length;
  list.innerHTML = all.length
    ? all.map((r, k) => card(r, k)).join("") +
      `<li><div class="info"><div class="title">Summe aller Favoriten</div>
       <div class="price">Günstigste Preise: <span>${fmt(sumBest)}</span><br>
       Nur HHV: <span>${fmt(sumHHV)}</span><br>Nur vinylpladen.de: <span>${fmt(sumVP)}</span>
       ${fehlt ? "<br><em style='color:#9a9a9a'>" + fehlt + " Favorit(en) ohne Preis</em>" : ""}</div></div></li>`
    : "<li>Noch keine Favoriten. Klicke auf das Herz bei einer Platte.</li>";
  genreLink.href = "https://www.hhv.de/records";
}

GENRES.forEach((g, i) => {
  const b = document.createElement("button");
  b.textContent = g.name;
  b.onclick = () => show(i);
  nav.appendChild(b);
});
const favBtn = document.createElement("button");
favBtn.textContent = "♥";
favBtn.title = "Favoriten";
favBtn.dataset.fav = "1";
favBtn.onclick = () => showFavs();
nav.appendChild(favBtn);
show(0);
</script>
</body>
</html>
