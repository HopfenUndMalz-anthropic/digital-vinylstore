<style>
  :root { --bg:#111; --card:#1c1c1c; --text:#f2f2f2; --muted:#9a9a9a; --accent:#e0a526; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:2rem 1rem 1rem; text-align:center; }
  header h1 { margin:0; font-size:2rem; letter-spacing:.04em; }
  header p { margin:.4rem 0 0; color:var(--muted); font-size:.9rem; }
  nav { display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; padding:1rem; }
  nav button { background:var(--card); color:var(--text); border:1px solid #333; padding:.5rem 1rem; border-radius:999px; cursor:pointer; font-size:.9rem; }
  nav button.active { background:var(--accent); color:#111; border-color:var(--accent); font-weight:600; }
  main { max-width:1000px; margin:0 auto; padding:1rem; }
  h2 { font-size:1.4rem; margin:.5rem 0 1rem; }
  .note { color:var(--muted); font-size:.8rem; margin-bottom:1rem; }
  ol.top10 { list-style:none; padding:0; margin:0; display:grid; gap:.75rem; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  ol.top10 li { background:var(--card); border-radius:10px; padding:1rem; display:flex; gap:1rem; }
  .rank { font-size:1.6rem; font-weight:700; color:var(--accent); min-width:2.2rem; }
  .info { flex:1; }
  .artist { color:var(--muted); font-size:.85rem; }
  .title { font-weight:600; margin:.1rem 0 .3rem; }
  .meta { font-size:.8rem; color:var(--muted); margin-bottom:.5rem; }
  .price { font-size:.85rem; margin-bottom:.5rem; }
  .price span { color:var(--accent); }
  .buy { display:inline-block; padding:.4rem .8rem; background:var(--accent); color:#111; border-radius:6px; text-decoration:none; font-weight:600; font-size:.85rem; }
  .genre-link { display:inline-block; margin-top:1.2rem; color:var(--accent); font-size:.9rem; }
  footer { text-align:center; color:var(--muted); font-size:.75rem; padding:2rem 1rem; }
</style>

const note = document.getElementById("genre-note");
const genreLink = document.getElementById("genre-link");

// Verlinkung: bei verglichenen Platten direkt zum günstigeren Shop,
// sonst HHV-Suche (Suchpfad getestet). Produktlinks vinylpladen: /vinyl/{artist}/{title}-LP-1 (Muster getestet).
const HHV_SEARCH = "https://www.hhv.de/records/katalog/filter/suche-D2N2S11?term=";
function buyUrl(r) {
  if (r.shops) {
    return r.shops.cheapest === "vinylpladen" ? r.shops.vinylpladen.url : r.shops.hhv.url;
  }
  return HHV_SEARCH + encodeURIComponent(r.artist + " " + r.title);
}

function priceHtml(r) {
  if (!r.shops) return `<div class="price">Ca. <span>${r.price}</span></div>`;
  const v = r.shops.vinylpladen, h = r.shops.hhv;
  const best = r.shops.cheapest === "vinylpladen" ? "vinylpladen.de" : "HHV";
  return `<div class="price">Standard-LP: vinylpladen.de <span>${v.price}</span> · HHV <span>${h.price}</span><br>Günstigster: <span>${best}</span></div>`;
}

function show(i) {
  document.querySelectorAll("nav button").forEach((b, j) => b.classList.toggle("active", i === j));
  const g = GENRES[i];
  title.textContent = g.name;
  note.textContent = "Auswahl: Klassiker und aktuelle Titel. Preisspannen sind Schätzungen.";
  genreLink.href = SHOP + "/genre/" + g.slug;
  list.innerHTML = g.records.map((r, k) => `
    <li>
      <div class="rank">${k + 1}</div>
      <div class="info">
        <div class="artist">${r.artist} · ${r.year} · ${r.source}</div>
        <div class="title">${r.title}</div>
        <div class="meta">${r.reason}</div>
        ${priceHtml(r)}
        <a class="buy" href="${buyUrl(r)}" target="_blank" rel="noopener">${r.shops ? "Zum günstigeren Shop" : "Im Shop suchen"}</a>
      </div>
    </li>`).join("");
}

GENRES.forEach((g, i) => {
  const b = document.createElement("button");
  b.textContent = g.name;
  b.onclick = () => show(i);
  nav.appendChild(b);
});
